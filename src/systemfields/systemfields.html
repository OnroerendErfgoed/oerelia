<template>
  <require from="./systemfields.css"></require>
  <hr />
  <ul>
    <li>Status: ${status.naam}</li>
    <li if.bind="createdBy || createdAt">
      Aangemaakt
      <template if.bind="createdBy">${' door: ' + createdBy}</template>
      <template if.bind="createdAt">${' op ' + createdAt}</template>
    </li>
    <li if.bind="updatedBy || updatedAt">
      Laatst bewerkt
      <template if.bind="updatedBy">${' door: ' + updatedBy}</template>
      <template if.bind="updatedAt">${' op ' + updatedAt}</template>
    </li>
    <template part="extra-content" replaceable></template>
  </ul>
</template>
